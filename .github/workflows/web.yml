# Tests every pull request and every push to main. Pushes to main are then
# exported for the web and published on GitHub Pages, so every change is
# instantly playable on the phone.
name: Web-Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot version is the same everywhere
        run: |
          for f in CLAUDE.md README.md; do
            grep -q "$GODOT_VERSION" "$f" || { echo "::error file=$f::mentions no Godot $GODOT_VERSION"; exit 1; }
          done

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project
        run: godot --headless --path . --import 2>&1 | tail -n 5

      - name: Run tests
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 --path . --script res://tests/run_tests.gd 2>&1 | tee test.log
          if grep -q "SCRIPT ERROR" test.log; then
            echo "::error::Script errors during the tests"
            exit 1
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Stamp build version
        run: sed -i "s/^config\/version=.*/config\/version=\"${GITHUB_SHA::7}\"/" project.godot

      - name: Export
        run: |
          mkdir -p build/web
          godot --headless --path . --import
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.pck

      - name: Cache-bust game data
        # GitHub Pages caches files for 10 minutes. A unique pack name per
        # commit makes sure the phone never runs stale game data.
        run: |
          cd build/web
          pck="index-${GITHUB_SHA::7}.pck"
          mv index.pck "$pck"
          sed -i "s/\"executable\":\"index\"/\"executable\":\"index\",\"mainPack\":\"$pck\"/; s/\"index.pck\":/\"$pck\":/" index.html
          grep -q "\"mainPack\":\"$pck\"" index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check compression of the engine download
        run: |
          url="${{ steps.deployment.outputs.page_url }}index.wasm"
          enc=$(curl -sSI -H "Accept-Encoding: gzip, br" "$url" | grep -i '^content-encoding' || echo "content-encoding: none")
          echo "index.wasm $enc" >> "$GITHUB_STEP_SUMMARY"
